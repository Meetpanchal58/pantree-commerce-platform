services:
  - type: web
    name: pantree-storefront
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements-render.txt
      python prepare_data.py --size small --recent-months 6   # fits the free plan's 512 MB
      python webapp/seed_db.py
    startCommand: cd webapp && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PANTREE_LIVE_MIRROR
        value: "0"
      - key: PANTREE_HEAVY_RECOMMENDATIONS
        value: "0"