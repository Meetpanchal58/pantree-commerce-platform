name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:  # the live database in production; tests/test_live_db_journey.py runs on it
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway test database: no password at all
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HF_HUB_OFFLINE: "1"  # tests never download the sentence-transformer model
      PANTREE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
      - name: Download the small shop (ecommerce-simulator, refreshed nightly)
        run: python prepare_data.py --size small
      - name: Tests
        run: python -m pytest -q
