services:
  supertokens-postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPERTOKENS_DB_NAME:?Set SUPERTOKENS_DB_NAME}
      POSTGRES_USER: ${SUPERTOKENS_DB_USER:?Set SUPERTOKENS_DB_USER}
      POSTGRES_PASSWORD: ${SUPERTOKENS_DB_PASSWORD:?Set a strong SUPERTOKENS_DB_PASSWORD}
    volumes:
      - supertokens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-private

  supertokens:
    image: supertokens/supertokens-postgresql:11.0@sha256:8d19640926c693498cfd4740ff395880ec6f3563695c0391e98bda32bb610137
    restart: unless-stopped
    depends_on:
      supertokens-postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: supertokens-postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USER: ${SUPERTOKENS_DB_USER:?Set SUPERTOKENS_DB_USER}
      POSTGRESQL_PASSWORD: ${SUPERTOKENS_DB_PASSWORD:?Set SUPERTOKENS_DB_PASSWORD}
      POSTGRESQL_DATABASE_NAME: ${SUPERTOKENS_DB_NAME:?Set SUPERTOKENS_DB_NAME}
      API_KEYS: ${SUPERTOKENS_API_KEY:?Set SUPERTOKENS_API_KEY}
      PASSWORDLESS_CODE_LIFETIME: "300000"
      PASSWORDLESS_MAX_CODE_INPUT_ATTEMPTS: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3567/hello | grep -q Hello"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - auth-private

  pantree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      supertokens:
        condition: service_healthy
    environment:
      APP_ENV: production
      PUBLIC_APP_URL: https://${PUBLIC_APP_HOST:?Set PUBLIC_APP_HOST}
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:?Set SUPERTOKENS_API_KEY}
      PANTREE_RATE_LIMIT_SECRET: ${PANTREE_RATE_LIMIT_SECRET:?Set PANTREE_RATE_LIMIT_SECRET}
      PANTREE_DB_PATH: /var/lib/pantree/pantree_app.db
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Pantree}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      OPENSMS_API_URL: ${OPENSMS_API_URL:?Set OPENSMS_API_URL}
      OPENSMS_API_KEY: ${OPENSMS_API_KEY:?Set OPENSMS_API_KEY}
    volumes:
      - type: bind
        source: ${PANTREE_DB_DIR:?Set PANTREE_DB_DIR to the durable directory containing pantree_app.db}
        target: /var/lib/pantree
        bind:
          create_host_path: false
      - type: bind
        source: ${PANTREE_DATA_DIR:?Set PANTREE_DATA_DIR to the read-only warehouse data directory}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - recommendation-cache:/app/recommendations/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      auth-private:
      proxy-private:
        ipv4_address: 172.31.0.3

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    depends_on:
      pantree:
        condition: service_healthy
    environment:
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:?Set PUBLIC_APP_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      proxy-private:
        ipv4_address: 172.31.0.2

networks:
  auth-private:
    internal: true
  proxy-private:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  supertokens-postgres-data:
  recommendation-cache:
  caddy-data:
  caddy-config:
